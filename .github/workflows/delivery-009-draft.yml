# AUTO-BATCH-009 delivery entry, OWNER-CONTROLLED. Lives in xuelingshang/opc-video-deliveries and runs only from
# its default branch (Actions -> "AUTO-BATCH-009 delivery draft" -> Run workflow; hourly only once the Founder sets
# the repository variable DELIVERY_009_SCHEDULE to "on").
#
# Trust model (same as delivery-008-draft.yml, which this file does not touch)
#   * Production stations (Cloud2/3/4/5/A/C) only commit DATA to the private 009 repository: each video's ZIP as
#     byte parts plus a manifest. They have no token that can write here, and nothing from the 009 repository is
#     executed by this workflow.
#   * The code that runs is this file and delivery-009/ on this repository's protected default branch.
#   * Writes use this repository's own short-lived GITHUB_TOKEN (contents: write): the 009 draft
#     delivery-009-2026-10-18-01 "AUTO-BATCH-009｜2026-10-18交付" (delivery-009/SOURCES.json) and the lock branch
#     delivery-009-lock.
#   * Reading the private 009 repository uses the environment secret OPC009_READ_TOKEN (fine-grained token: only
#     that repository, Contents read-only). It is only given to step 2, through git's GIT_CONFIG_* variables.
#   * Draft only: there is no publish step. Never touches 007's or 008's releases, workflows or lock branch.
#   * This repository is public, so this log is public: it shows video ids, manifest paths, sizes and SHA256s
#     only. No artifacts are uploaded.
name: AUTO-BATCH-009 delivery draft
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: only report what would be delivered (no lock, no release writes)
        type: boolean
        default: true
      ids:
        description: optional comma list, e.g. 009-043,009-049 (empty = every video in SOURCES.json only_ids)
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: delivery-009-draft
  cancel-in-progress: false
jobs:
  deliver:
    if: >-
      github.repository == 'xuelingshang/opc-video-deliveries' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.DELIVERY_009_SCHEDULE == 'on')
    runs-on: ubuntu-latest
    environment: delivery-009
    timeout-minutes: 300
    steps:
      - name: Checkout this repository's delivery code (no credentials kept on disk)
        uses: actions/checkout@v4
        with:
          path: dlv
          persist-credentials: false
      - name: Install ffprobe (used by the restore check and the packer); free runner disk for ~10 GB of parts
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          df -h .
      - name: 1 · 009 draft state (GITHUB_TOKEN of this repository, read only here)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 dlv/delivery-009/run_009.py state --repo "$GITHUB_REPOSITORY" --work work
      - name: 2 · Parts and manifests from the 009 repository (read-only token; data only, nothing from it runs)
        env:
          READ_TOKEN: ${{ secrets.OPC009_READ_TOKEN }}
          IDS: ${{ inputs.ids }}
        run: |
          if [ -z "$READ_TOKEN" ]; then
            echo "::error::environment secret OPC009_READ_TOKEN (environment delivery-009) is not set"; exit 1
          fi
          AUTH=$(printf 'x-access-token:%s' "$READ_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          unset READ_TOKEN
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
                 GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          python3 dlv/delivery-009/run_009.py fetch --work work --ids "$IDS"
      - name: 3 · Restore each ZIP from its parts, verify every SHA256 and the layout (no credentials)
        run: python3 dlv/delivery-009/run_009.py rebuild --work work
      - name: 4 · Lock, append to the 009 draft one video at a time, verify, unlock (GITHUB_TOKEN of this repository)
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
                 GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          python3 dlv/delivery-009/run_009.py deliver --repo "$GITHUB_REPOSITORY" --work work --lock-dir dlv \
            ${DRY_RUN:+--dry-run}
