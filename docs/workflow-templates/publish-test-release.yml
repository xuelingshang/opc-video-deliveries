# TEMPLATE. To enable: copy to .github/workflows/publish-test-release.yml on main, then
# Actions → "Publish TEST delivery release" → Run workflow (Founder-triggered only).
# Publishes ONE original test sample (TEST-0001: synthetic pattern + tone, no third-party
# material) as an R2 batch release delivery-YYYY-MM-DD-NN using this repository's own
# GITHUB_TOKEN. Formal videos are never published by this workflow.
name: Publish TEST delivery release
on:
  workflow_dispatch:
    inputs:
      delivery_date:
        description: "Delivery date of the test batch (YYYY-MM-DD)"
        required: true
        default: "2026-10-13"
      video_id:
        description: "Test video id (must start with TEST-)"
        required: true
        default: "TEST-0001"
permissions:
  contents: write
concurrency:
  group: publish-delivery
  cancel-in-progress: false
jobs:
  publish-test:
    runs-on: ubuntu-latest
    env:
      DELIVERY_DATE: ${{ inputs.delivery_date }}
      VIDEO_ID: ${{ inputs.video_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and a CJK font
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-noto-cjk
      - name: Generate original test asset
        run: bash publisher/make_test_asset.sh "$VIDEO_ID" work/src
      - name: Pack VIDEO-ID-DELIVERY.zip
        run: |
          python3 publisher/opc_pack.py --id "$VIDEO_ID" --mp4 "work/src/$VIDEO_ID/$VIDEO_ID.mp4" \
            --cover "work/src/$VIDEO_ID/cover.jpg" --weibo "work/src/$VIDEO_ID/weibo.txt" \
            --srt "work/src/$VIDEO_ID/subtitle.srt" --out work/pkg
      - name: Draft → upload → verify → publish → anonymous download check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 publisher/opc_publish.py --repo "$GITHUB_REPOSITORY" --date "$DELIVERY_DATE" \
            --pkg "work/pkg/$VIDEO_ID" --test --full-anon-verify --target "$GITHUB_SHA" \
            --manifest-out work/delivery-manifest.json
      - name: Keep the manifest with the run
        uses: actions/upload-artifact@v4
        with:
          name: delivery-manifest
          path: work/delivery-manifest.json
